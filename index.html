<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RBXLAB | профессиональный инструментарий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            cursor: default;
        }

        /* ТЕМНЫЙ ПРОФЕССИОНАЛЬНЫЙ ФОН - ДЫМКА, МЕТАЛЛ, ГЛУБИНА */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: radial-gradient(circle at 30% 40%, #0a0e14, #020304);
        }

        /* ЗЕРНИСТАЯ ТЕКСТУРА ДЛЯ ПРОФЕССИОНАЛИЗМА */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР — СТРОГАЯ СЕТКА */
        .content {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 780px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
        }

        /* ЗАГОЛОВОК: МИНИМАЛИЗМ, МОНОШИРИН, МЕТАЛЛИК */
        .title-section {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .glow-text {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: 'Inter', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8edf2 0%, #9aaebf 45%, #cbdbe0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 0.5px solid rgba(100, 120, 140, 0.5);
            margin-top: 12px;
        }

        .badge span {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            font-weight: 500;
            color: #8fafcf;
            text-transform: uppercase;
            font-family: monospace;
        }

        .badge i {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #3dd68c;
            border-radius: 50%;
            box-shadow: 0 0 6px #3dd68c;
        }

        /* ПАНЕЛЬ С КНОПКАМИ — СТЕКЛО, НО БЕЗ ДЕТСКОЙ ПЕСТРОТЫ */
        .glass-panel {
            background: rgba(12, 16, 22, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 2rem 1.8rem;
            width: 100%;
            border: 0.5px solid rgba(70, 100, 130, 0.4);
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
            transition: all 0.2s;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        /* ПРОФЕССИОНАЛЬНЫЕ КНОПКИ: ХАЙ-ТЕК, СТРОГИЕ, НО МОЩНЫЕ */
        .neo-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.8rem;
            font-weight: 550;
            font-family: 'Inter', monospace;
            background: rgba(8, 12, 18, 0.75);
            backdrop-filter: blur(4px);
            border: 0.5px solid rgba(70, 120, 160, 0.35);
            border-radius: 18px;
            color: #eef4ff;
            text-decoration: none;
            transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            letter-spacing: -0.2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* левая часть кнопки с иконкой и названием */
        .btn-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .btn-icon {
            font-size: 1.6rem;
            font-weight: 400;
            opacity: 0.85;
            filter: drop-shadow(0 0 2px rgba(0,180,255,0.3));
            transition: all 0.2s;
            width: 32px;
            text-align: center;
        }

        .btn-text {
            font-size: 1.2rem;
            font-weight: 540;
            letter-spacing: -0.2px;
            background: linear-gradient(135deg, #eef4ff 0%, #cbdae9 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* акцентная стрелка */
        .btn-arrow {
            font-family: monospace;
            font-size: 1.1rem;
            color: #5c7f9c;
            transition: transform 0.2s ease, color 0.2s;
            opacity: 0.7;
        }

        /* HOVER — ДОРОГОЙ ПОДСВЕТКИ НЕТ, ТОЛЬКО МЕТАЛЛИЧЕСКОЕ СВЕЧЕНИЕ */
        .neo-btn:hover {
            background: rgba(20, 30, 42, 0.9);
            border-color: rgba(80, 150, 200, 0.6);
            box-shadow: 0 6px 14px rgba(0,0,0,0.4), 0 0 0 1px rgba(80, 180, 255, 0.2);
            transform: translateY(-2px);
        }

        .neo-btn:hover .btn-arrow {
            transform: translateX(5px);
            color: #8bb9e0;
            opacity: 1;
        }

        .neo-btn:hover .btn-icon {
            transform: scale(1.02);
            opacity: 1;
            filter: drop-shadow(0 0 4px #2f7faf);
        }

        .neo-btn:active {
            transform: translateY(1px);
            transition: 0.05s;
        }

        /* индивидуальные акценты — но очень сдержанные */
        .neo-btn:nth-child(1):hover .btn-icon { text-shadow: 0 0 3px #3d9eda; }
        .neo-btn:nth-child(2):hover .btn-icon { text-shadow: 0 0 3px #5f8bff; }
        .neo-btn:nth-child(3):hover .btn-icon { text-shadow: 0 0 3px #3ad1b0; }
        .neo-btn:nth-child(4):hover .btn-icon { text-shadow: 0 0 3px #dc8eff; }
        .neo-btn:nth-child(5):hover .btn-icon { text-shadow: 0 0 3px #ffa06f; }

        /* Адаптивность */
        @media (max-width: 650px) {
            .content {
                padding: 1.5rem;
            }
            .glow-text {
                font-size: 3.2rem;
            }
            .neo-btn {
                padding: 0.8rem 1.2rem;
            }
            .btn-text {
                font-size: 0.95rem;
            }
            .btn-icon {
                font-size: 1.3rem;
                width: 28px;
            }
            .glass-panel {
                padding: 1.5rem 1rem;
            }
            .btn-left {
                gap: 12px;
            }
        }

        /* анимация появления */
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .title-section, .glass-panel {
            animation: fadeSlide 0.5s ease forwards;
        }

        .neo-btn {
            animation: fadeSlide 0.4s ease backwards;
        }
        .neo-btn:nth-child(1) { animation-delay: 0.05s; }
        .neo-btn:nth-child(2) { animation-delay: 0.1s; }
        .neo-btn:nth-child(3) { animation-delay: 0.15s; }
        .neo-btn:nth-child(4) { animation-delay: 0.2s; }
        .neo-btn:nth-child(5) { animation-delay: 0.25s; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer">
        <canvas id="canvas-bg"></canvas>
    </div>
    <div class="noise"></div>

    <div class="content">
        <div class="title-section">
            <h1 class="glow-text">RBXLAB</h1>
            <div class="badge">
                <i></i>
                <span>TOOLKIT // STUDIO GRADE</span>
                <i style="background: #3dd68c; box-shadow: 0 0 4px #3dd68c;"></i>
            </div>
        </div>

        <div class="glass-panel">
            <div class="button-grid">
                <!-- 1. ENABLE SHADERS -->
                <a href="https://rbxlab.st/Enable-Shaders/robloxtoolzzz" target="_blank" rel="noopener noreferrer" class="neo-btn">
                    <div class="btn-left">
                        <span class="btn-icon">⌛</span>
                        <span class="btn-text">Enable Shaders</span>
                    </div>
                    <div class="btn-arrow">➔</div>
                </a>
                <!-- 2. COPY GAMES -->
                <a href="https://rbxlab.st/Game-Copier/robloxtoolzzz" target="_blank" rel="noopener noreferrer" class="neo-btn">
                    <div class="btn-left">
                        <span class="btn-icon">🕹️</span>
                        <span class="btn-text">Copy Games</span>
                    </div>
                    <div class="btn-arrow">➔</div>
                </a>
                <!-- 3. VC ENABLER -->
                <a href="https://rbxlab.st/VC-Enabler/robloxtoolzzz" target="_blank" rel="noopener noreferrer" class="neo-btn">
                    <div class="btn-left">
                        <span class="btn-icon">🎙️</span>
                        <span class="btn-text">VC Enabler</span>
                    </div>
                    <div class="btn-arrow">➔</div>
                </a>
                <!-- 4. JOIN ANYONE -->
                <a href="https://rbxlab.st/Join-Any/robloxtoolzzz" target="_blank" rel="noopener noreferrer" class="neo-btn">
                    <div class="btn-left">
                        <span class="btn-icon">👥</span>
                        <span class="btn-text">Join Anyone</span>
                    </div>
                    <div class="btn-arrow">➔</div>
                </a>
                <!-- 5. COPY CLOTHES -->
                <a href="https://rbxlab.st/Copy-Clothes/robloxtoolzzz" target="_blank" rel="noopener noreferrer" class="neo-btn">
                    <div class="btn-left">
                        <span class="btn-icon">👕</span>
                        <span class="btn-text">Copy Clothes</span>
                    </div>
                    <div class="btn-arrow">➔</div>
                </a>
            </div>
        </div>
        <!-- Футер полностью удалён — никаких надписей на русском -->
    </div>

    <script>
        (function() {
            // ---------- ПРОФЕССИОНАЛЬНЫЙ ХАЙ-ТЕК ФОН: ДЫМКА, АККУРАТНЫЕ ЧАСТИЦЫ И МЕТАЛЛИЧЕСКИЙ БЛЕСК ----------
            const canvas = document.getElementById('canvas-bg');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let time = 0;
            
            // сеть нейтральных микрочастиц (неоновые точки, но строго)
            let particles = [];
            const PARTICLE_COUNT = 110;
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            
            function initParticles() {
                particles = [];
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.8 + 0.6,
                        alpha: Math.random() * 0.4 + 0.1,
                        speedX: (Math.random() - 0.5) * 0.2,
                        speedY: (Math.random() - 0.5) * 0.1,
                        color: `rgba(130, 170, 210, ${Math.random() * 0.3})`
                    });
                }
            }
            
            // глубокий радиальный градиент с холодными оттенками
            function drawDeepBackground() {
                const grad = ctx.createRadialGradient(width*0.7, height*0.3, 50, width*0.5, height*0.6, width*0.8);
                grad.addColorStop(0, '#0a111a');
                grad.addColorStop(0.5, '#070c12');
                grad.addColorStop(1, '#010203');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                // тонкие линии сетки (текстура hi-tech)
                ctx.strokeStyle = 'rgba(60, 100, 130, 0.18)';
                ctx.lineWidth = 0.6;
                const step = 45;
                for(let i = 0; i < width + step; i += step) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i % height);
                    ctx.lineTo(width, i % height);
                    ctx.stroke();
                }
                
                // слабые движущиеся световые пятна (профессиональная глубина)
                for(let l=0; l<3; l++) {
                    const xOff = Math.sin(time*0.2 + l)*150 + width*0.4;
                    const yOff = Math.cos(time*0.3 + l)*120 + height*0.5;
                    const radG = ctx.createRadialGradient(xOff, yOff, 10, xOff-30, yOff-20, 180);
                    radG.addColorStop(0, `rgba(70, 130, 180, 0.03)`);
                    radG.addColorStop(1, `rgba(20, 40, 60, 0)`);
                    ctx.fillStyle = radG;
                    ctx.fillRect(0, 0, width, height);
                }
            }
            
            function drawParticles() {
                for(let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    // движение частиц
                    p.x += p.speedX + (Math.sin(time * 0.4 + p.y * 0.006) * 0.08);
                    p.y += p.speedY + (Math.cos(time * 0.5 + p.x * 0.005) * 0.06);
                    if(p.x < -20) p.x = width + 15;
                    if(p.x > width + 20) p.x = -20;
                    if(p.y < -20) p.y = height + 20;
                    if(p.y > height + 20) p.y = -20;
                }
            }
            
            // добавим сверхредкие "звезды" — едва заметный минимализм
            let stars = [];
            function initStars() {
                stars = [];
                for(let i=0; i<80; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        rad: Math.random() * 1.2,
                        alpha: Math.random() * 0.4 + 0.1
                    });
                }
            }
            
            function drawStars() {
                for(let s of stars) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.rad, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(210, 225, 245, ${s.alpha * 0.5})`;
                    ctx.fill();
                }
            }
            
            function animateBg() {
                if(!ctx) return;
                time += 0.012;
                drawDeepBackground();
                drawParticles();
                drawStars();
                requestAnimationFrame(animateBg);
            }
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
                initStars();
            });
            
            resizeCanvas();
            initParticles();
            initStars();
            animateBg();
        })();
        
        // простая защита от контекстного меню (профилактика, не мешает)
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // добавим также лёгкий блик на кнопках (тень при клике)
        const buttons = document.querySelectorAll('.neo-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // лёгкая тактильная анимация
                btn.style.transform = 'translateY(1px)';
                setTimeout(() => { btn.style.transform = ''; }, 100);
            });
        });
        
        console.log('RBXLAB | профессиональный режим активирован');
    </script>
</body>
</html>
